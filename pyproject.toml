[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pai-adv1"
version = "0.1.0"
description = "Isaac Sim 6.1 experiments"
requires-python = ">=3.12,<3.13"
# Isaac Sim 本体（isaacsim==6.1.0.0）と torch は NVIDIA のインデックスから別途導入済みの前提
dependencies = [
    "nvidia-ml-py",
    "psutil",
    "pillow",
    # VLM（Issue #5）。anthropic 1.x は httpx2（idna>=3.18 が必要）を使い、Isaac Sim の idna==3.10 と衝突するので 0.x に留める
    "anthropic>=0.125,<1",
    "google-genai>=2.29",
    "python-dotenv",
]

# src/restorebot を editable install する: .venv\Scripts\python.exe -m pip install -e .
[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
# 導入: .venv\Scripts\python.exe -m pip install --group dev
dev = [
    "pytest",
    "ruff",
]

# ------------------------------------------------------------
# pytest
#   普段の `pytest` では Isaac Sim が必要なテスト（isaac マーカー）を除外する。
#   明示的に実行する場合は `pytest -m isaac`。
# ------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not isaac", "--strict-markers", "-ra"]
markers = [
    "isaac: Isaac Sim の起動が必要なテスト（遅い・GPU 必須）。`pytest -m isaac` で実行",
]

# ------------------------------------------------------------
# ruff
# ------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID251"]

[tool.ruff.lint.isort]
known-first-party = ["experiments", "restorebot", "smoke_test"]

# Isaac Sim への依存の分離（CLAUDE.md「設計のルール」）
#   isaacsim / omni / pxr / carb の import は原則禁止し、
#   Isaac Sim に依存してよい場所（per-file-ignores）だけで許可する。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"isaacsim".msg = "Isaac Sim に依存するコードは src/restorebot/sim/ に置く（core は Isaac Sim 非依存）"
"omni".msg = "Isaac Sim に依存するコードは src/restorebot/sim/ に置く（core は Isaac Sim 非依存）"
"pxr".msg = "Isaac Sim に依存するコードは src/restorebot/sim/ に置く（core は Isaac Sim 非依存）"
"carb".msg = "Isaac Sim に依存するコードは src/restorebot/sim/ に置く（core は Isaac Sim 非依存）"

[tool.ruff.lint.per-file-ignores]
"src/restorebot/sim/**" = ["TID251"]
"scripts/**" = ["TID251"]
"tests/sim/**" = ["TID251"]
